name: CI

# CI runs on the self-hosted runner on the netcup server, which is also
# production. To keep that load down it runs on pull requests and by hand,
# not again on pushes or when a checked pull request is merged to main.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # The netcup self-hosted runner: no Docker, no sudo, capped by ci.slice.
    runs-on: [self-hosted, netcup]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @vip/api prisma:generate

      - name: Build shared package
        run: pnpm --filter @vip/shared build

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build apps
        run: pnpm build
