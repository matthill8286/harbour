# Weekly update pull requests. Minor and patch updates arrive together; each
# major update gets its own pull request. Security updates arrive as needed.
version: 2
updates:
  # One entry covers every package in the pnpm workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Node moves to a new major version by hand: CI, .nvmrc and the Dockerfile change together.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # A new PostgreSQL major cannot read the old data files, so it needs a planned upgrade.
    ignore:
      - dependency-name: postgis/postgis
        update-types: ['version-update:semver-major']
