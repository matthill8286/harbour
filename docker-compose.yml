services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vip
      POSTGRES_PASSWORD: vip
      POSTGRES_DB: vehicle_import
    ports:
      - "5432:5432"
    volumes:
      - vip_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vip -d vehicle_import"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vip_pg_data:
